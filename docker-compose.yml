version: '3.8'

services:
  backend:
    build: ./server
    container_name: syncboard-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/syncboard
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=http://localhost
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: .
    container_name: syncboard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: syncboard-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: